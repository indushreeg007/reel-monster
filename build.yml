name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: |
          flutter create --platforms=android --org com.reelmonster --project-name reel_monster app_build
          cp -r overlay/. app_build/
          cd app_build && flutter pub get && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: {name: reel-monster-apk, path: app_build/build/app/outputs/flutter-apk/app-release.apk}
